<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEARBUY Seller Dashboard</title>
<link rel="icon" type="image/png" href="nearbuy-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--teal:#138e97;--teal-dark:#0c6f76;--orange:#f29b38;--bg:#faf8f5;--card:#fff;--text:#1d2528;--muted:#727b7e;--border:#e6e3df;--danger:#c84444;--success:#197a52;--shadow:0 10px 28px rgba(22,32,35,.08);--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.app{max-width:1100px;margin:auto;min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:rgba(250,248,245,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--teal);color:#fff;display:grid;place-items:center}.brand strong{font-size:18px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.top-actions{display:flex;gap:8px}.icon-btn,.back-btn{border:1px solid var(--border);background:#fff;width:40px;height:40px;border-radius:12px;cursor:pointer;color:var(--text)}main{padding:20px}.screen{display:none}.screen.active{display:block}.login-wrap{min-height:calc(100vh - 100px);display:grid;place-items:center}.login-card{width:min(440px,100%);background:var(--card);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.login-logo{width:58px;height:58px;border-radius:17px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:24px;margin-bottom:18px}.login-card h1{margin:0 0 7px;font-size:25px}.login-card p{color:var(--muted);font-size:14px;line-height:1.5}.field{margin-top:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);background:#fff;border-radius:12px;padding:12px 13px;font:inherit;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(19,142,151,.1)}.btn{border:0;border-radius:12px;padding:12px 15px;font:inherit;font-weight:700;cursor:pointer}.btn-primary{background:var(--teal);color:#fff}.btn-primary:hover{background:var(--teal-dark)}.btn-light{background:#f1f0ed;color:var(--text)}.btn-danger{background:#fff0f0;color:var(--danger)}.btn-small{padding:8px 10px;font-size:12px}.pin-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.pin-row input{text-align:center;font-size:20px;font-weight:700}.error{background:#fff0f0;color:#a33a3a;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:12px;display:none}.dashboard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}.dashboard-head h1{font-size:25px;margin:0 0 5px}.dashboard-head p{margin:0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--border);border-radius:15px;padding:16px;box-shadow:0 5px 18px rgba(22,32,35,.04)}.stat .num{font-size:23px;font-weight:800}.stat .label{font-size:12px;color:var(--muted);margin-top:4px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:5px;margin-bottom:16px}.tab{white-space:nowrap;border:1px solid var(--border);background:#fff;border-radius:11px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer}.tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}.panel{background:#fff;border:1px solid var(--border);border-radius:17px;padding:17px;box-shadow:0 5px 18px rgba(22,32,35,.04)}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.panel-head h2{font-size:17px;margin:0}.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.product{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff}.product img{width:100%;height:160px;object-fit:cover;background:#f0efec}.product-body{padding:12px}.product h3{font-size:14px;margin:0 0 6px}.price{font-weight:800;color:var(--teal);font-size:14px}.meta{font-size:11px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.empty{padding:35px 15px;text-align:center;color:var(--muted);font-size:13px}.order{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}.order:last-child{margin-bottom:0}.order-top{display:flex;justify-content:space-between;gap:10px}.order-id{font-weight:800;font-size:14px}.badge{display:inline-flex;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#edf6f3;color:var(--success)}.order-items{margin-top:10px;background:#faf9f7;border-radius:10px;padding:9px}.order-item{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:4px 0}.chat-layout{display:grid;grid-template-columns:280px 1fr;gap:12px;min-height:520px}.rooms{border:1px solid var(--border);border-radius:14px;overflow:auto;background:#fff}.room{padding:12px;border-bottom:1px solid var(--border);cursor:pointer}.room.active{background:#eef9f8}.room strong{font-size:12px;display:block}.room small{font-size:10px;color:var(--muted)}.chat-box{border:1px solid var(--border);border-radius:14px;background:#fff;display:flex;flex-direction:column;min-height:520px}.chat-head{padding:13px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px}.messages{flex:1;padding:13px;overflow:auto}.msg{max-width:75%;padding:9px 11px;border-radius:13px;background:#f0efec;margin-bottom:8px;font-size:12px;line-height:1.4}.msg.mine{margin-left:auto;background:#dff5f2}.msg small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.chat-send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}.chat-send input{flex:1;border:1px solid var(--border);border-radius:11px;padding:10px}.notice{border:1px solid var(--border);border-radius:13px;padding:13px;margin-bottom:9px}.notice.unread{background:#f2fbfa;border-color:#cde9e5}.notice h3{font-size:13px;margin:0 0 5px}.notice p{font-size:12px;margin:0;color:#4e585b;line-height:1.45}.notice small{font-size:10px;color:var(--muted)}.profile-grid{display:grid;grid-template-columns:150px 1fr;gap:18px}.seller-photo{width:140px;height:140px;border-radius:18px;object-fit:cover;background:#f0efec}.seller-photo-empty{width:140px;height:140px;border-radius:18px;background:#eef5f4;display:grid;place-items:center;color:var(--teal);font-size:38px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;background:#222;color:#fff;padding:11px 15px;border-radius:10px;font-size:12px;display:none;max-width:90%;text-align:center}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-card{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:19px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:#f1f0ed;border-radius:9px;width:34px;height:34px;cursor:pointer}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.preview{width:100%;max-height:190px;object-fit:cover;border-radius:12px;margin-top:8px;display:none}.locked{opacity:.65;pointer-events:none}@media(max-width:760px){main{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.product-grid{grid-template-columns:repeat(2,1fr)}.chat-layout{grid-template-columns:1fr}.rooms{max-height:180px}.profile-grid{grid-template-columns:1fr}.dashboard-head{flex-direction:column}}@media(max-width:480px){.product-grid{grid-template-columns:1fr}.topbar{padding:12px}.brand strong{font-size:16px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brand-mark"><i class="fas fa-store"></i></div><div><strong>NEARBUY</strong><small>Seller Dashboard</small></div></div>
  <div class="top-actions"><button class="icon-btn" onclick="goHome()" aria-label="Home"><i class="fas fa-arrow-left"></i></button><button class="icon-btn" id="logoutTop" onclick="sellerLogout()" style="display:none" aria-label="Logout"><i class="fas fa-right-from-bracket"></i></button></div>
</header>
<main>
<section id="loginScreen" class="screen active">
  <div class="login-wrap"><div class="login-card">
    <div class="login-logo"><i class="fas fa-store"></i></div>
    <h1>Seller Login</h1><p id="sellerIntro">Enter the phone number and 4-digit PIN provided by NEARBUY.</p>
    <div class="field"><label>Phone Number</label><input id="sellerLoginPhone" type="tel" inputmode="tel" placeholder="0812 345 6789"></div>
    <div class="field"><label>4-Digit PIN</label><div class="pin-row"><input id="pin1" maxlength="1" inputmode="numeric" type="password"><input id="pin2" maxlength="1" inputmode="numeric" type="password"><input id="pin3" maxlength="1" inputmode="numeric" type="password"><input id="pin4" maxlength="1" inputmode="numeric" type="password"></div></div>
    <div id="loginError" class="error"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:16px" onclick="sellerLogin()"><i class="fas fa-lock"></i> Sign In</button>
    <button class="btn btn-light" style="width:100%;margin-top:8px" onclick="goHome()">Back to NEARBUY</button>
  </div></div>
</section>

<section id="dashboardScreen" class="screen">
  <div class="dashboard-head"><div><h1 id="welcomeTitle">Welcome back</h1><p id="sellerBusinessLine"></p></div><button class="btn btn-primary" onclick="openProductModal()"><i class="fas fa-plus"></i> Add Product</button></div>
  <div class="stats"><div class="stat"><div class="num" id="statProducts">0</div><div class="label">My Products</div></div><div class="stat"><div class="num" id="statOrders">0</div><div class="label">My Orders</div></div><div class="stat"><div class="num" id="statPending">0</div><div class="label">Pending Orders</div></div><div class="stat"><div class="num" id="statUnread">0</div><div class="label">Unread Notifications</div></div></div>
  <div class="tabs">
    <button class="tab active" data-tab="products" onclick="showTab('products')"><i class="fas fa-box"></i> Products</button>
    <button class="tab" data-tab="orders" onclick="showTab('orders')"><i class="fas fa-receipt"></i> Orders</button>
    <button class="tab" data-tab="chats" onclick="showTab('chats')"><i class="far fa-comment-dots"></i> Chats</button>
    <button class="tab" data-tab="notifications" onclick="showTab('notifications')"><i class="far fa-bell"></i> Notifications</button>
    <button class="tab" data-tab="profile" onclick="showTab('profile')"><i class="far fa-user"></i> Profile</button>
  </div>
  <div id="tab-products" class="panel tab-panel"></div>
  <div id="tab-orders" class="panel tab-panel" style="display:none"></div>
  <div id="tab-chats" class="panel tab-panel" style="display:none"></div>
  <div id="tab-notifications" class="panel tab-panel" style="display:none"></div>
  <div id="tab-profile" class="panel tab-panel" style="display:none"></div>
</section>
</main>
</div>
<div id="productModal" class="modal"><div class="modal-card"><div class="modal-head"><h2 id="productModalTitle">Add Product</h2><button class="close" onclick="closeProductModal()">×</button></div>
  <input type="hidden" id="editProductId">
  <div class="field"><label>Product Name</label><input id="productName" placeholder="e.g. Campus Hoodie"></div>
  <div class="field"><label>Price (₦)</label><input id="productPrice" type="number" min="1" placeholder="15000"></div>
  <div class="field"><label>Category</label><select id="productCategory"><option>Electronics</option><option>Fashion</option><option>Books</option><option>Home</option><option>Beauty</option><option>Food</option><option>Other</option></select></div>
  <div class="field"><label>Product Image</label><input id="productImage" type="file" accept="image/*" onchange="previewImage(event)"><img id="productPreview" class="preview" alt="Product preview"></div>
  <div class="form-actions"><button class="btn btn-light" onclick="closeProductModal()">Cancel</button><button class="btn btn-primary" onclick="saveProduct()">Save Product</button></div>
</div></div>
<div id="toast" class="toast"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyAYPuPym3g5l2LZ3CQLCKUJkoHwkUOATTE',authDomain:'nearbuy-8abc4.firebaseapp.com',projectId:'nearbuy-8abc4',storageBucket:'nearbuy-8abc4.firebasestorage.app',messagingSenderId:'810641764402',appId:'1:810641764402:web:91e2addba1215ca6ef8c2b'};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
let currentSeller=null,products=[],orders=[],notifications=[],rooms={},activeRoom='',unsubs=[];
const params=new URLSearchParams(location.search); const urlSellerId=params.get('sellerId');
const $=id=>document.getElementById(id);
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',3000)}
function normPhone(v){return String(v||'').replace(/\D/g,'').replace(/^234/,'0').replace(/^0?/,'0')}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function hashPin(pin){const data=new TextEncoder().encode(pin);const buf=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}
async function loadSeller(){const snap=await getDocs(collection(db,'sellers'));let found=null;snap.forEach(d=>{const s={firestoreId:d.id,...d.data()};if(urlSellerId&&String(s.sellerId)===String(urlSellerId))found=s});if(found){currentSeller=found;$('sellerBusinessLine').textContent=found.business||'NEARBUY Seller';$('sellerIntro').textContent=`Sign in to manage ${found.business||'your NEARBUY store'}.`;if(found.status==='inactive'){$('loginError').textContent='This seller account is inactive. Please contact NEARBUY.';$('loginError').style.display='block';$('sellerLoginPhone').disabled=true;document.querySelectorAll('.pin-row input').forEach(x=>x.disabled=true)}}else{ $('sellerIntro').textContent='This seller link is invalid or the seller profile could not be found.'; }}
function pinValue(){return ['pin1','pin2','pin3','pin4'].map(id=>$(id).value).join('')}
window.sellerLogin=async function(){if(!currentSeller){toast('Seller profile not found');return}const phone=normPhone($('sellerLoginPhone').value);const pin=pinValue();const err=$('loginError');err.style.display='none';if(!phone||!/^\d{4}$/.test(pin)){err.textContent='Enter your phone number and 4-digit PIN.';err.style.display='block';return}try{const hash=await hashPin(pin);if(normPhone(currentSeller.phone)!==phone||currentSeller.pinHash!==hash){err.textContent='Incorrect phone number or PIN.';err.style.display='block';return}sessionStorage.setItem('nearbuySellerId',currentSeller.sellerId);showDashboard();}catch(e){console.error(e);err.textContent='Unable to sign in. Please try again.';err.style.display='block'}}
function showDashboard(){ $('loginScreen').classList.remove('active');$('dashboardScreen').classList.add('active');$('logoutTop').style.display='block';$('welcomeTitle').textContent=`Welcome, ${currentSeller.name||'Seller'}`;startListeners();renderAll() }
function clearListeners(){unsubs.forEach(fn=>{try{fn()}catch{}});unsubs=[]}
function startListeners(){clearListeners();unsubs.push(onSnapshot(collection(db,'products'),snap=>{products=[];snap.forEach(d=>products.push({firestoreId:d.id,...d.data()}));renderAll()}));unsubs.push(onSnapshot(collection(db,'orders'),snap=>{orders=[];snap.forEach(d=>orders.push({firestoreId:d.id,...d.data()}));renderAll()}));unsubs.push(onSnapshot(collection(db,'notifications'),snap=>{notifications=[];snap.forEach(d=>{const n={firestoreId:d.id,...d.data()};if(String(n.sellerId||'')===String(currentSeller.sellerId||''))notifications.push(n)});notifications.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));renderAll()}));unsubs.push(onSnapshot(collection(db,'chats'),snap=>{const mineProducts=new Set(products.filter(p=>String(p.sellerId)===String(currentSeller.sellerId)).map(p=>String(p.id)));rooms={};snap.forEach(d=>{const m={firestoreId:d.id,...d.data()};if(mineProducts.has(String(m.productId))){const key=m.roomId||`${m.userPhone}_${m.productId}`;(rooms[key]??=[]).push(m)}});Object.values(rooms).forEach(a=>a.sort((x,y)=>new Date(x.createdAt||0)-new Date(y.createdAt||0)));renderAll()}))}
function myProducts(){return products.filter(p=>String(p.sellerId)===String(currentSeller.sellerId))}
function myOrders(){return orders.filter(o=>(o.items||[]).some(i=>String(i.sellerId||'')===String(currentSeller.sellerId)))}
function renderAll(){if(!currentSeller)return;const mp=myProducts(),mo=myOrders();$('statProducts').textContent=mp.length;$('statOrders').textContent=mo.length;$('statPending').textContent=mo.filter(o=>!['Completed','Rejected'].includes(o.status)).length;$('statUnread').textContent=notifications.filter(n=>!n.read).length;renderProducts(mp);renderOrders(mo);renderChats();renderNotifications();renderProfile()}
function renderProducts(mp){$('tab-products').innerHTML=`<div class="panel-head"><h2>My Products</h2><button class="btn btn-primary btn-small" onclick="openProductModal()"><i class="fas fa-plus"></i> Add Product</button></div>${mp.length?`<div class="product-grid">${mp.map(p=>`<div class="product"><img src="${escapeHtml(p.image||'')}" alt="Product"><div class="product-body"><h3>${escapeHtml(p.name)}</h3><div class="price">₦${Number(p.price||0).toLocaleString()}</div><div class="meta">${escapeHtml(p.category||'Other')} · ${Number(p.sales||0)} sales</div><div class="actions"><button class="btn btn-light btn-small" onclick="editProduct('${p.firestoreId}')"><i class="fas fa-pen"></i> Edit</button><button class="btn btn-danger btn-small" onclick="removeProduct('${p.firestoreId}')"><i class="fas fa-trash"></i> Delete</button></div></div></div>`).join('')}</div>`:'<div class="empty"><i class="fas fa-box-open" style="font-size:34px"></i><p>No products yet. Add your first product.</p></div>'}`}
function renderOrders(mo){const sorted=[...mo].sort((a,b)=>new Date(b.createdAt||b.date||0)-new Date(a.createdAt||a.date||0));$('tab-orders').innerHTML=`<div class="panel-head"><h2>My Orders</h2><span class="meta">Only orders containing your products</span></div>${sorted.length?sorted.map(o=>{const items=(o.items||[]).filter(i=>String(i.sellerId||'')===String(currentSeller.sellerId));return `<div class="order"><div class="order-top"><div><div class="order-id">#${escapeHtml(o.id||o.firestoreId)}</div><div class="meta">${escapeHtml(o.userName||'Customer')} · ${escapeHtml(o.userPhone||o.phone||'')} · ${o.createdAt?new Date(o.createdAt).toLocaleString():escapeHtml(o.date||'')}</div></div><span class="badge">${escapeHtml(o.status||'Placed')}</span></div><div class="order-items">${items.map(i=>`<div class="order-item"><span>${escapeHtml(i.name||'Product')} × ${Number(i.quantity||1)}</span><strong>₦${Number(i.price||0).toLocaleString()}</strong></div>`).join('')}</div><div class="actions"><select id="status-${o.firestoreId}" style="border:1px solid var(--border);border-radius:10px;padding:8px;font-size:11px"><option>Placed</option><option>Uploaded</option><option>Confirmed</option><option>Preparing</option><option>Shipped</option><option>Ready for Pickup</option><option>Completed</option><option>Rejected</option></select><button class="btn btn-primary btn-small" onclick="updateOrderStatus('${o.firestoreId}')">Update Status</button></div></div>`}).join(''):'<div class="empty">No orders for your products yet.</div>'}`;sorted.forEach(o=>{const el=$(`status-${o.firestoreId}`);if(el)el.value=o.status||'Placed'})}
function renderChats(){const keys=Object.keys(rooms);$('tab-chats').innerHTML=`<div class="panel-head"><h2>Buyer Chats</h2><span class="meta">Real-time seller replies</span></div>${keys.length?`<div class="chat-layout"><div class="rooms">${keys.map(k=>{const a=rooms[k],f=a[0]||{};return `<div class="room ${activeRoom===k?'active':''}" onclick="selectRoom('${encodeURIComponent(k)}')"><strong>${escapeHtml(f.productName||'Product chat')}</strong><small>${escapeHtml(f.userName||'Customer')} · ${escapeHtml(f.userPhone||'')}</small></div>`}).join('')}</div><div class="chat-box">${renderActiveRoom()}</div></div>`:'<div class="empty"><i class="far fa-comment-dots" style="font-size:34px"></i><p>No buyer chats yet.</p></div>'}`}
function renderActiveRoom(){if(!activeRoom&&Object.keys(rooms).length)activeRoom=Object.keys(rooms)[0];const a=rooms[activeRoom]||[];const f=a[0]||{};return `<div class="chat-head">${escapeHtml(f.productName||'Select a chat')} · ${escapeHtml(f.userName||'')}</div><div class="messages">${a.length?a.map(m=>`<div class="msg ${m.senderRole==='seller'?'mine':''}"><strong>${m.senderRole==='seller'?'You':escapeHtml(m.userName||'Buyer')}</strong><div>${escapeHtml(m.message||'')}</div><small>${m.createdAt?new Date(m.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''}</small></div>`).join(''):'<div class="empty">No messages yet.</div>'}</div><div class="chat-send"><input id="sellerChatInput" placeholder="Reply to buyer..." onkeydown="if(event.key==='Enter')sendSellerMessage()"><button class="btn btn-primary btn-small" onclick="sendSellerMessage()"><i class="fas fa-paper-plane"></i></button></div>`}
window.selectRoom=function(encoded){activeRoom=decodeURIComponent(encoded);renderChats()}
window.sendSellerMessage=async function(){const input=$('sellerChatInput');const message=input?.value.trim();if(!message||!activeRoom)return;const a=rooms[activeRoom]||[];const first=a[0]||{};try{await addDoc(collection(db,'chats'),{roomId:activeRoom,productId:first.productId,productName:first.productName,userPhone:first.userPhone,userName:first.userName,sellerId:currentSeller.sellerId,senderRole:'seller',message,createdAt:new Date().toISOString()});input.value='';await addDoc(collection(db,'notifications'),{userPhone:normPhone(first.userPhone),title:'New seller message',message:`${currentSeller.business||currentSeller.name} replied to your chat about ${first.productName||'your product'}.`,type:'chat',read:false,createdAt:new Date().toISOString()})}catch(e){console.error(e);toast('Unable to send message')}}
function renderNotifications(){const arr=notifications; $('tab-notifications').innerHTML=`<div class="panel-head"><h2>Seller Notifications</h2><button class="btn btn-light btn-small" onclick="markAllRead()">Mark all read</button></div>${arr.length?arr.map(n=>`<div class="notice ${n.read?'':'unread'}"><h3>${escapeHtml(n.title||'NEARBUY Update')}</h3><p>${escapeHtml(n.message||'')}</p><small>${n.createdAt?new Date(n.createdAt).toLocaleString():''}</small></div>`).join(''):'<div class="empty">No seller notifications yet.</div>'}`}
window.markAllRead=async function(){for(const n of notifications.filter(x=>!x.read&&x.firestoreId)){try{await updateDoc(doc(db,'notifications',n.firestoreId),{read:true})}catch(e){}}toast('Notifications marked as read')}
function renderProfile(){const s=currentSeller;const photo=s.photo?`<img class="seller-photo" src="${escapeHtml(s.photo)}" alt="Seller profile">`:`<div class="seller-photo-empty"><i class="fas fa-store"></i></div>`;$('tab-profile').innerHTML=`<div class="panel-head"><h2>Seller Profile</h2><button class="btn btn-primary btn-small" onclick="editProfile()">Edit Profile</button></div><div class="profile-grid"><div>${photo}</div><div><div class="field"><label>Name</label><input value="${escapeHtml(s.name||'')}" disabled></div><div class="field"><label>Business</label><input value="${escapeHtml(s.business||'')}" disabled></div><div class="field"><label>Phone</label><input value="${escapeHtml(s.phone||'')}" disabled></div><div class="field"><label>Email</label><input value="${escapeHtml(s.email||'')}" disabled></div><div class="field"><label>Location</label><input value="${escapeHtml(s.location||'')}" disabled></div><div class="field"><label>Seller ID</label><input value="${escapeHtml(s.sellerId||'')}" disabled></div></div></div>`}
window.editProfile=function(){const s=currentSeller; $('tab-profile').innerHTML=`<div class="panel-head"><h2>Edit Seller Profile</h2></div><div class="field"><label>Name</label><input id="profileName" value="${escapeHtml(s.name||'')}"></div><div class="field"><label>Business</label><input id="profileBusiness" value="${escapeHtml(s.business||'')}"></div><div class="field"><label>Email</label><input id="profileEmail" value="${escapeHtml(s.email||'')}"></div><div class="field"><label>Location</label><input id="profileLocation" value="${escapeHtml(s.location||'')}"></div><div class="field"><label>New Profile Photo (optional)</label><input id="profilePhoto" type="file" accept="image/*"></div><div class="actions"><button class="btn btn-light" onclick="renderProfile()">Cancel</button><button class="btn btn-primary" onclick="saveProfile()">Save Changes</button></div>`}
window.saveProfile=async function(){try{const data={name:$('profileName').value.trim(),business:$('profileBusiness').value.trim(),email:$('profileEmail').value.trim(),location:$('profileLocation').value.trim()};const file=$('profilePhoto').files[0];if(file)data.photo=await compressImage(file);await updateDoc(doc(db,'sellers',currentSeller.firestoreId),data);Object.assign(currentSeller,data);toast('Profile updated successfully');renderProfile();}catch(e){console.error(e);toast('Profile could not be updated')}}
function compressImage(file,max=900,q=.78){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',q))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
window.openProductModal=function(product=null){$('productModal').classList.add('open');$('editProductId').value=product?.firestoreId||'';$('productModalTitle').textContent=product?'Edit Product':'Add Product';$('productName').value=product?.name||'';$('productPrice').value=product?.price||'';$('productCategory').value=product?.category||'Other';$('productImage').value='';$('productPreview').src=product?.image||'';$('productPreview').style.display=product?.image?'block':'none'}
window.closeProductModal=function(){$('productModal').classList.remove('open')}
window.editProduct=function(id){const p=products.find(x=>x.firestoreId===id&&String(x.sellerId)===String(currentSeller.sellerId));if(p)openProductModal(p)}
window.saveProduct=async function(){const id=$('editProductId').value,name=$('productName').value.trim(),price=Number($('productPrice').value),category=$('productCategory').value,file=$('productImage').files[0];if(!name||!price||price<=0){toast('Enter a valid product name and price');return}try{let image='';if(id){const p=products.find(x=>x.firestoreId===id);image=p?.image||''}if(file){if(!file.type.startsWith('image/')){toast('Please select a valid image');return}image=await compressImage(file)}if(!image){toast('Please select a product image');return}const data={name,price,category,image,sellerId:currentSeller.sellerId,sellerName:currentSeller.name||'NEARBUY Seller',sellerPhone:currentSeller.phone||''};if(id)await updateDoc(doc(db,'products',id),data);else await addDoc(collection(db,'products'),{...data,id:Date.now(),sales:0,createdAt:new Date().toISOString()});closeProductModal();toast(id?'Product updated successfully':'Product added successfully')}catch(e){console.error(e);toast('Product could not be saved')}}
window.removeProduct=async function(id){const p=products.find(x=>x.firestoreId===id&&String(x.sellerId)===String(currentSeller.sellerId));if(!p)return;if(!confirm(`Delete "${p.name}"?`))return;try{await deleteDoc(doc(db,'products',id));toast('Product deleted')}catch(e){console.error(e);toast('Product could not be deleted')}}
window.updateOrderStatus=async function(id){const o=orders.find(x=>x.firestoreId===id);if(!o)return;const status=$(`status-${id}`).value;try{await updateDoc(doc(db,'orders',id),{status});const buyerPhone=normPhone(o.userPhone||o.phone);await addDoc(collection(db,'notifications'),{userPhone:buyerPhone,title:status==='Ready for Pickup'?'Order ready for pickup':'Order update',message:`Your order #${o.id||id} is now ${status}.`,type:'order',read:false,createdAt:new Date().toISOString()});toast('Order status updated')}catch(e){console.error(e);toast('Order status could not be updated')}}
window.showTab=function(tab){document.querySelectorAll('.tab-panel').forEach(x=>x.style.display='none');$(`tab-${tab}`).style.display='block';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));if(tab==='chats')renderChats();if(tab==='notifications')markAllRead()}
window.sellerLogout=function(){clearListeners();sessionStorage.removeItem('nearbuySellerId');currentSeller=null;products=[];orders=[];notifications=[];rooms={};activeRoom='';$('dashboardScreen').classList.remove('active');$('loginScreen').classList.add('active');$('logoutTop').style.display='none';['pin1','pin2','pin3','pin4'].forEach(id=>$(id).value='');toast('Signed out successfully')}
window.goHome=function(){location.href='index.html'}
function renderInitialSession(){const sid=sessionStorage.getItem('nearbuySellerId');if(sid&&currentSeller&&String(sid)===String(currentSeller.sellerId))showDashboard()}
['pin1','pin2','pin3','pin4'].forEach((id,i)=>$(id).addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,1);if(e.target.value&&i<3)$(`pin${i+2}`).focus()}));document.addEventListener('keydown',e=>{if(e.key==='Backspace'&&document.activeElement?.id?.startsWith('pin')){const i=Number(document.activeElement.id.replace('pin',''));if(!$(document.activeElement.id).value&&i>1)$(`pin${i-1}`).focus()}});
window.previewImage=function(e){const f=e.target.files[0],img=$('productPreview');if(!f){img.style.display='none';return}if(!f.type.startsWith('image/')){toast('Please select an image');e.target.value='';return}const r=new FileReader();r.onload=()=>{img.src=r.result;img.style.display='block'};r.readAsDataURL(f)}
loadSeller().then(()=>{const sid=sessionStorage.getItem('nearbuySellerId');if(sid&&currentSeller&&String(sid)===String(currentSeller.sellerId))showDashboard()}).catch(e=>{console.error(e);$('loginError').textContent='Unable to load seller account. Check Firestore rules.';$('loginError').style.display='block'});
</script>
</body>
